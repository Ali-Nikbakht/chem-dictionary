<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
  --bg:#f5f8fa;--surface:#fff;--surface2:#eef5f5;--text:#12202a;--muted:#667680;
  --primary:#0b6b73;--primary2:#159a8c;--accent:#1d7ed1;--border:#dbe5e8;
  --shadow:0 16px 45px rgba(17,42,52,.09);--radius:20px;
}
[data-theme="dark"]{
  --bg:#0c1519;--surface:#122126;--surface2:#172d32;--text:#edf7f7;--muted:#9db1b7;
  --primary:#4dc2b4;--primary2:#68d6b9;--accent:#6eb8ff;--border:#263d43;
  --shadow:0 18px 50px rgba(0,0,0,.25);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Vazirmatn,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}
.app-shell{min-height:100vh}.topbar{height:72px;display:flex;align-items:center;gap:26px;padding:0 clamp(16px,4vw,54px);background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}
.brand{border:0;background:none;display:flex;align-items:center;gap:10px;padding:0}.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;text-align:left}.brand strong{font-size:16px}
.desktop-nav{display:flex;gap:4px;flex:1;justify-content:center}.desktop-nav button,.mobile-nav button{border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600}.desktop-nav button:hover,.mobile-nav button:hover{background:var(--surface2);color:var(--text)}.desktop-nav button.active{background:var(--surface2);color:var(--primary)}
.top-actions{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.mobile-menu-btn{display:none}.mobile-nav{display:none}
main{max-width:1240px;margin:auto;padding:32px clamp(16px,4vw,44px) 60px}
.hero{display:grid;grid-template-columns:1.45fr .85fr;gap:24px;align-items:stretch}.hero-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:28px;padding:clamp(26px,5vw,56px);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero-card:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-110px;bottom:-130px;background:color-mix(in srgb,var(--primary) 13%,transparent)}
.eyebrow{color:var(--primary);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1;margin:12px 0}.hero h1 span{color:var(--primary)}.hero p{color:var(--muted);max-width:680px;line-height:1.75}.credit{font-family:Vazirmatn,Inter,sans-serif;color:var(--muted);font-size:13px;direction:ltr}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:22px;border:1px solid var(--border);background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}.stat b{font-size:30px;display:block}.stat span{color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{border:1px solid var(--border);background:var(--surface);padding:11px 16px;border-radius:12px;font-weight:700}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.secondary{background:var(--surface2);border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
.section{margin-top:34px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}.section h2{margin:0;font-size:24px}.section-head p{margin:4px 0 0;color:var(--muted)}
.word-day{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:25px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}.word-day .word{font-size:30px;font-weight:800}.word-day .meaning{font-family:Vazirmatn;font-size:18px;margin-top:5px}.definition{color:var(--muted);line-height:1.7;margin-top:12px}
.progress-wrap{height:10px;background:var(--surface2);border-radius:20px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px;transition:width .4s ease}
.search-row{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-bottom:18px}.search{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);outline:none}.search:focus{border-color:var(--primary)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:18px}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface);padding:8px 12px;border-radius:999px;color:var(--muted)}.chip.active{background:var(--primary);border-color:var(--primary);color:white}
.dictionary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.word-card{border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:18px;transition:transform .2s,border-color .2s,box-shadow .2s;box-shadow:0 8px 25px rgba(17,42,52,.04)}.word-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 45%,var(--border));box-shadow:var(--shadow)}.word-card button{background:none;border:0;padding:0;text-align:left;width:100%}.word-card .en{font-weight:800;font-size:18px}.word-card .fa{font-family:Vazirmatn;margin-top:6px}.word-card .topic{color:var(--muted);font-size:11px;margin-top:12px}.card-top{display:flex;justify-content:space-between;gap:8px}.star{border:0;background:none;font-size:20px;padding:0;color:#9ba8ad}.star.on{color:#e8ad18}
.pager{display:flex;justify-content:center;gap:8px;margin-top:22px;align-items:center}.pager button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 12px}
.empty{padding:45px;text-align:center;border:1px dashed var(--border);border-radius:18px;color:var(--muted)}
.flashcard-wrap{max-width:720px;margin:30px auto}.flashcard{height:390px;perspective:1200px;cursor:pointer}.flash-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s}.flashcard.flipped .flash-inner{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,var(--surface),var(--surface2));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.flash-back{transform:rotateY(180deg)}.flash-word{font-size:46px;font-weight:800}.flash-meaning{font-family:Vazirmatn;font-size:30px;margin:8px}.hint{color:var(--muted);margin-top:15px}.flash-controls{display:flex;justify-content:center;gap:10px;margin-top:16px}
.quiz-layout{max-width:820px;margin:auto}.quiz-config,.quiz-card,.result-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.select,.number{width:100%;padding:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--border);margin-top:14px}.switch{width:48px;height:27px;border-radius:99px;background:var(--border);position:relative;border:0}.switch:after{content:"";position:absolute;width:21px;height:21px;top:3px;left:3px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--primary)}.switch.on:after{left:24px}.quiz-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.question{font-size:28px;font-weight:800;margin:25px 0}.question-fa{font-family:Vazirmatn;font-size:24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{padding:15px;border:1px solid var(--border);background:var(--surface2);border-radius:14px;text-align:left;font-weight:650}.option:hover{border-color:var(--primary)}.option.correct{background:#dff5ec;border-color:#2aa77e}.option.wrong{background:#fde7e7;border-color:#dc6a6a}.result-score{font-size:56px;font-weight:800;color:var(--primary)}.mistake{padding:14px;border:1px solid var(--border);border-radius:14px;margin-top:10px}.mistake b{display:block}.mistake small{color:var(--muted)}
.fav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px;border-radius:16px;background:var(--surface2)}.metric b{font-size:25px;display:block}.metric span{font-size:12px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(3,13,16,.58);z-index:50;display:grid;place-items:center;padding:18px}.hidden{display:none}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;position:relative;box-shadow:0 30px 100px rgba(0,0,0,.35)}.modal-close{position:absolute;right:15px;top:12px;width:36px;height:36px;border:0;background:var(--surface2);border-radius:10px;font-size:25px}.detail-word{font-size:38px;font-weight:800;padding-right:45px}.detail-meaning{font-family:Vazirmatn;font-size:22px;margin:8px 0 22px}.detail-row{padding:14px 0;border-top:1px solid var(--border)}.detail-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.08em}.detail-value{margin-top:5px;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{border-top:1px solid var(--border);padding:22px clamp(16px,4vw,54px);display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:12px}.footer strong,.footer span{display:block}
@media(max-width:900px){.desktop-nav{display:none}.mobile-menu-btn{display:block}.hero{grid-template-columns:1fr}.dictionary-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:none;position:sticky;top:72px;z-index:19;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 14px;grid-template-columns:repeat(3,1fr)}.mobile-nav.open{display:grid}.mobile-nav button{padding:10px}}
@media(max-width:600px){main{padding-top:20px}.topbar{height:64px}.mobile-nav{top:64px}.hero h1{font-size:42px}.stats{grid-template-columns:repeat(2,1fr)}.dictionary-grid,.fav-grid{grid-template-columns:1fr}.search-row{grid-template-columns:1fr}.config-grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.flashcard{height:330px}.flash-word{font-size:34px}.footer{flex-direction:column}.word-day{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}}


/* ===== i18n / RTL + new components ===== */
html[lang="fa"] body,html[lang="fa"] button,html[lang="fa"] input,html[lang="fa"] select{font-family:Vazirmatn,Inter,sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .ltr{text-align:right}
.word-card button,.option{text-align:start}
html[dir="rtl"] .brand small{text-align:right}
html[dir="rtl"] .modal-close{right:auto;left:15px}
html[dir="rtl"] .detail-word{padding-right:0;padding-left:45px}
html[dir="rtl"] .hero-card:after{right:auto;left:-110px}
.brand-logo{width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;object-fit:contain;border:1px solid var(--border);display:block}
.brand strong{display:block}
.lang-btn{width:auto;padding:0 14px;font-weight:700;font-size:13px}
.hero-org{display:flex;align-items:center;gap:14px;margin-bottom:18px;position:relative;z-index:1}
.hero-logo{width:84px;height:84px;border-radius:20px;background:#fff;padding:4px;object-fit:contain;border:1px solid var(--border);box-shadow:var(--shadow)}
.hero-org b{display:block;font-size:17px}.hero-org small{color:var(--muted);font-size:13px}
.hero-card>*{position:relative;z-index:1}
.credit-banner{display:flex;align-items:center;gap:22px;padding:clamp(20px,3.5vw,32px);border-radius:26px;color:#fff;background:linear-gradient(135deg,#0b6b73,#159a8c 60%,#1d7ed1);box-shadow:0 18px 50px rgba(11,107,115,.35);position:relative;overflow:hidden}
.credit-banner:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;inset-inline-end:-90px;top:-130px;background:rgba(255,255,255,.12)}
.credit-banner>*{position:relative}
.cb-logo{width:96px;height:96px;flex:none;border-radius:22px;background:#fff;padding:5px;object-fit:contain;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cb-label{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px}
.credit-banner h3{margin:10px 0 2px;font-size:clamp(24px,4vw,34px);line-height:1.2}
.cb-role{margin:0;font-weight:700;opacity:.95}
.cb-note{margin:10px 0 0;line-height:1.8;opacity:.9;font-size:14px}
.feedback{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);line-height:1.8}
.feedback.ok{border-color:#2e9e62;background:color-mix(in srgb,#2e9e62 14%,var(--surface))}
.feedback.bad{border-color:#d6453d;background:color-mix(in srgb,#d6453d 12%,var(--surface))}
.feedback .fb-title{font-weight:800;font-size:16px}
.feedback .fb-answer{margin-top:4px}
.feedback .fb-answer b{font-size:18px}
.feedback .fb-def{color:var(--muted);font-size:14px;margin-top:6px}
.search.ok-input{border-color:#2e9e62}.search.bad-input{border-color:#d6453d}
.q-hint{color:var(--muted);font-size:13px;margin:-4px 0 14px}
.question .en-q{direction:ltr;unicode-bidi:isolate;display:block}
.footer-credit{color:var(--primary);font-weight:700}
@media(max-width:600px){.credit-banner{flex-direction:column;text-align:center}.hero-org{flex-direction:column;align-items:flex-start}}
@media(max-width:600px){.brand strong{font-size:14px}.icon-btn{font-size:16px}}
.icon-btn{display:grid;place-items:center;line-height:1}

</style>
</head>

lation":null,"relatedWords":[],"lessons":[4],"topics":["Unit operations"],"pages":[15],"id":155},{"word":"Homogeneous mixture","meaning":"مخلوط همگن","pronunciation":"/həˈmɒdʒ.ɪ.nəs ˈmɪks.tʃər/","definition":"A mixture with uniform composition and properties throughout.","topic":"Unit operations","lesson":4,"page":15,"example":null,"translation":null,"relatedWords":[],"lessons":[4],"topics":["Unit operations"],"pages":[15],"id":156},{"word":"Preferential transfer","meaning":"انتقال ترجیحی","pronunciation":"/prɪˈfɛr.ən.ʃəl ˈtræns.fɜːr/","definition":"Selective movement of one component into another phase because it has a higher affinity or solubility there.","topic":"Unit operations","lesson":4,"page":15,"example":null,"translation":null,"relatedWords":[],"lessons":[4],"topics":["Unit operations"],"pages":[15],"id":157},{"word":"Dehumidification","meaning":"رطوبت زدایی خشک سازی هوا","pronunciation":"/ˌdiː.hjuː.mɪ.dɪ.fɪˈkeɪ.ʃən/","definition":"Removal of water vapor from air by cooling below its dew point or by using chemical/physical absorbents.","topic":"Unit operations","lesson":4,"page":15,"example":null,"translation":null,"relatedWords":[],"lessons":[4],"topics":["Unit operations"],"pages":[15],"id":158},{"word":"Solvent","meaning":"حالل","pronunciation":"/ˈsɒl.vənt/","definition":"A liquid capable of dissolving other substances to form a solution; also used as a selective phase in extraction operations.","topic":"Unit operations","lesson":4,"page":16,"example":null,"translation":null,"relatedWords":[],"lessons":[4],"topics":["Unit operations"],"pages":[16],"id":159},{"word":"Insoluble","meaning":"نامحلول","pronunciation":"/ɪnˈsɒl.juː.bəl/","definition":"A substance that does not dissolve appreciably in a given solvent.","topic":"Unit operations","lesson":4,"page":16,"example":null,"translation":null,"relatedWords":[],"lessons":[4],"topics":["Unit operations"],"pages":[16],"id":160},{"word":"Interfacial tension","meaning":"تنش بین سطحی","pronunciation":"/ˌɪn.tərˈ cs"],"pages":[66],"id":804},{"word":"Isothermal at constant volume ˈkɒn.stənt","meaning":"ایزوترمال در حجم ثابت","pronunciation":"/ˌaɪ.səʊˈθɜː.məl ˈkɒn.stənt ˈvɒl.juːm/","definition":"An isothermal at constant volume process occurs when the Temperature remains constant While the volume of the system is fixed. In such cases, any heat Added to the system changes the internal energy, since no work (PΔV) is done.","topic":"Reaction kinetics","lesson":18,"page":66,"example":null,"translation":null,"relatedWords":[],"lessons":[18],"topics":["Reaction kinetics"],"pages":[66],"id":805},{"word":"Isothermal at constant pressure","meaning":"ایزوترمال در فشار ثابت","pronunciation":"/ˌaɪ.səʊˈθɜː.məl ˈkɒn.stənt ˈpreʃ.ər/","definition":"An isothermal at constant pressure process occurs when the temperature stays constant while the pressure of the system Remains fixed. In this case, heat Added to the system (Q) is equal to the change in enthalpy (ΔH), Because the system can do work (PΔV) on its surroundings.","topic":"Reaction kinetics","lesson":18,"page":66,"example":null,"translation":null,"relatedWords":[],"lessons":[18],"topics":["Reaction kinetics"],"pages":[66],"id":806},{"word":"Adiabatic","meaning":"فرآیند بدون تبادل حرارتی","pronunciation":"/ˌæd.iˈæb.ə.tɪk/","definition":"An adiabatic process occurs without any heat transfer (Q between the system and its Surroundings. All changes in the System’s internal energy result in Work done by or on the system. Examples include rapid compression or expansion of gases in engines or reactors.","topic":"Reaction kinetics","lesson":18,"page":66,"example":null,"translation":null,"relatedWords":[],"lessons":[18],"topics":["Reaction kinetics"],"pages":[66],"id":807},{"word":"Stirred tank","meaning":"مخزن همزده یا راکتور همزن دار","pronunciation":"/stɜːd tæŋk/","definition":"A stirred tank is a vessel equipped with mechanical agitation to mix fluids enhance mass or heat transfer. A tubular reactor (or plug flow reactor, PFR) is a reactor wh یری گرانروی به کار می‌رود.","136":"ناحیه‌ای بین جریان آرام و آشفته.","137":"جریانی که شامل چرخش ذرات سیال است.","138":"انرژی‌ای که یک سیال دارد.","139":"جریانی که در آن سرعت از نقطه‌ای به نقطهٔ دیگر تغییر می‌کند.","140":"محوری که توان مکانیکی را منتقل می‌کند.","141":"حرکت تصادفی مولکول‌ها.","142":"وسیلهٔ اندازه‌گیری جریان که دبی را بر پایهٔ اختلاف فشار در یک زانویی لوله تعیین می‌کند.","143":"شرایطی که در آن هیچ انتقال خالصی از جرم، انرژی یا تکانه بین فازها رخ نمی‌دهد، زیرا همهٔ نیروهای محرکه از بین رفته‌اند. خواص سامانه با زمان ثابت می‌ماند.","144":"اختلاف بین حالت موجود و حالت تعادل. این اختلاف پتانسیلی (در غلظت، دما، فشار یا ولتاژ) فراهم می‌کند که باعث جریان جرم، گرما یا الکتریسیته می‌شود.","145":"ناحیه‌ای از ماده که از نظر فیزیکی یکنواخت و متمایز است (جامد، مایع یا بخار) و خواص فیزیکی و شیمیایی ثابتی دارد.","146":"مقدار یک جزء موجود در مخلوط، بر حسب واحد حجم یا جرم. این کمیت بر انتقال جرم و سرعت واکنش‌ها اثر شدیدی دارد.","147":"غلظت مؤثر که رفتار غیرایده‌آل محلول‌ها را در نظر می‌گیرد؛ در محاسبات ترمودینامیکی به جای غلظت واقعی به کار می‌رود.","148":"معیاری از توانایی یک سامانه برای انجام کار یا ایجاد جریان.","149":"حرکت یک گونهٔ شیمیایی از ناحیه‌ای با غلظت (یا فعالیت) بالا به ناحیه‌ای با غلظت کمتر، در اثر نیروی محرکه.","150":"حرکت انرژی گرمایی از نواحی با دمای بالا به نواحی با دمای کمتر از طریق رسانش، همرفت یا تابش.","151":"فاز گازی یک ماده در دمایی پایین‌تر از دمای بحرانی که با فاز مایع خود در تعادل (یا در آستانهٔ تعادل) است.","152":"تبدیل بخار به مایع هنگامی که انرژی گرمایی گرفته شود یا بخار فوق‌اشباع گردد.","153":"فشار تعادلی که یک بخار در تماس با مایع خود در دمای معین اعمال می‌کند.","154":"وسیله‌ای که بخار را سرد می‌کند و به مایع تبدیل می‌کند.","155":"هر عملیاتی که یک مخلوط را بر پایهٔ تفاوت در خواص فیزیکی یا شیمیایی به دو یا چند بخش تقسیم می‌کند.","156":"مخلوطی که ترکیب و خواص آن در همه‌جا یکنواخت است.","157":"حرکت انتخابی یک جزء به فاز دیگر، چون در آنجا میل ترکیبی یا حلالیت بیشتری دارد.","158":"حذف بخار آب از هوا با سرد کردن آن به زیر نقطهٔ شبنم یا با استفاده از جاذب‌های شیمیایی/فیزیکی.","159":"مایعی که می‌تواند مواد دیگر را حل کند و محلول بسازد؛ در عملیات استخراج به عنوان فاز انتخابی نیز به کار می‌رود.","160":"مادهٔ نامحلول؛ ماده‌ای که در یک حلال معین به‌طور قابل‌توجهی حل نمی‌شود.","161":"نیرو بر واحد طول در فصل مشترک دو فاز امتزاج‌ناپذیر.","162":"آرایش فضایی جهت جریان‌ها در تماس با هم، مانند هم‌جهت، مخالف‌جهت یا متقاطع.","163":"توده‌ای از سیال (مایع، گاز یا مخلوط) در حال جریان که با فشار، دما، ترکیب و دبی مشخص می‌شود.","164":"آرایش جریانی که در آن دو جریان هنگام تبادل گرما یا جرم هم‌جهت حرکت می‌کنند.","165":"آرایش جریانی که در آن جریان‌ها در خلاف جهت یکدیگر حرکت می‌کنند و بازده انتقال را بیشینه می‌کنند.","166":"روش فرایندی که در آن مواد به‌طور پیوسته وارد تجهیز می‌شوند و از آن خارج می‌شوند. متغیرهای فرایند جز در دوره‌های کوتاه راه‌اندازی و توقف، تقریباً با زمان ثابت می‌مانند.","167":"روش فرایندی که در آن مقدار مشخصی ماده به تجهیز شارژ می‌شود، به صورت یک واحد فرآوری می‌شود و سپس کاملاً تخلیه می‌گردد. شرایط فرایند در طول عملیات با زمان تغییر می‌کند.","168":"بازهٔ گذرایی که در آن شرایط تجهیز (دما، دبی، فشار، ترکیب) از حالت سکون به حالت پایای مطلوب تغییر می‌کند.","169":"بازهٔ گذرایی که در آن سامانه از عملکرد عادی به حالت سکون یا غیرعملیاتی می‌رسد.","170":"مقدار جرم یا انرژی منتقل‌شده در واحد زمان. این کمیت ظرفیت تجهیز را تعیین می‌کند و مستقیماً بر اندازه و عملکرد طراحی اثر می‌گذارد.","171":"شرایطی که در آن همهٔ متغیرهای فرایند با زمان ثابت می‌مانند، هرچند ممکن است از نقطه‌ای به نقطهٔ دیگر سامانه تغییر کنند.","172":"شرایطی که در آن یک یا چند متغیر فرایند با زمان تغییر می‌کنند. ویژهٔ راه‌اندازی، توقف، کوئنچ، انجماد و بیشتر فرایندهای ناپیوسته است.","173":"خاصیت یا شرایط فرایندی که با گذشت زمان تغییر نمی‌کند؛ ویژگی فرایندهای حالت پایا.","174":"سرد کردن سریع یک ماده، معمولاً با قرار دادن آن در محیطی سردتر، برای تغییر سریع دما، متوقف کردن یک واکنش یا ایجاد تغییر فاز یا ساختار.","175":"فرایند تغییر فاز که در آن مایع سرد می‌شود تا جامد گردد؛ معمولاً به عنوان مثالی از انتقال حرارت حالت ناپایا ذکر می‌شود.","176":"هر عملیات فیزیکی، مال فشار برای شکل‌دهی یا فشرده کردن ماده.","794":"ساخت ورقه‌های نازک با غلتاندن بین استوانه‌ها.","795":"شکل‌دهی با ریختن مایع در قالب.","796":"تقویت با افزودن الیاف یا پرکننده‌ها.","797":"تشکیل الیاف از مذاب یا محلول پلیمر.","798":"نابودی ذره و پادذره همراه با آزاد شدن انرژی.","799":"پلیمری ساخته‌شده از بلوک‌های متمایز مونومرها.","800":"پلیمری با شاخه‌های جانبی از زنجیر اصلی.","801":"لیفی ساخته‌شده از دو یا چند پلیمر که در یک رشته ترکیب شده‌اند.","802":"مطالعهٔ نیروها و چگونگی اثر آن‌ها بر حرکت اجسام در مهندسی.","803":"واکنش تک‌مولکولی شامل تبدیل یک مولکول واحد به محصولات است، مثلاً واکنش‌های تجزیه یا ایزومریزاسیون. سرعت آن فقط به غلظت همان یک واکنش‌دهنده بستگی دارد.","804":"واکنش دومولکولی شامل برخورد دو مولکول یا گونه برای تشکیل محصولات است. سرعت واکنش به غلظت هر دو واکنش‌دهنده بستگی دارد؛ مثلاً A + B → محصولات.","805":"فرایند همدما در حجم ثابت زمانی رخ می‌دهد که دما ثابت می‌ماند در حالی که حجم سامانه ثابت است. در این حالت هر گرمایی که به سامانه افزوده شود انرژی درونی را تغییر می‌دهد، چون کاری (PΔV) انجام نمی‌شود.","806":"فرایند همدما در فشار ثابت زمانی رخ می‌دهد که دما ثابت می‌ماند در حالی که فشار سامانه ثابت است. در این حالت گرمای افزوده‌شده به سامانه (Q) با تغییر آنتالپی (ΔH) برابر است، چون سامانه می‌تواند روی محیط اطراف کار (PΔV) انجام دهد.","807":"فرایند بی‌دررو بدون هیچ انتقال گرمایی (Q = 0) بین سامانه و محیط رخ می‌دهد. همهٔ تغییرات انرژی درونی سامانه از کاری ناشی می‌شود که توسط سامانه یا روی آن انجام می‌شود. نمونه‌ها: تراکم یا انبساط سریع گازها در موتورها یا راکتورها.","808":"مخزن همزن‌دار ظرفی مجهز به همزن مکانیکی برای مخلوط کردن سیالات و بهبود انتقال جرم یا گرماست.","809":"واکنش‌دهنده‌ها از درون یک لوله عبور می‌کنند و در حین حرکت واکنش می‌دهند. هر «برش» از راکتور می‌تواند ترکیب متفاوتی داشته باشد، برخلاف راکتور مخزن همزن‌دار.","810":"راکتور مخزن همزن‌دار که محتویات آن کاملاً مخلوط است.","811":"راکتور بستر ثابت حاوی کاتالیست جامد ساکن است و سیال واکنش‌دهنده از روی یا درون آن جریان می‌یابد. معمولاً در واکنش‌های کاتالیستی ناهمگن مانند هیدروژناسیون یا اکسیداسیون به کار می‌رود، جایی که ثابت نگه داشتن بستر کاتالیست تماس و بازده واکنش را بهبود می‌دهد.","812":"راکتور بستر متحرک اجازه می‌دهد کاتالیست جامد یا ذرات به‌آهستگی (معمولاً با گرانش به سمت پایین) حرکت کنند، در حالی که سیال از میان آن‌ها می‌گذرد. این طراحی بهره‌برداری از کاتالیست را بهبود می‌دهد و برخلاف بستر ثابت که جامد ساکن است، عملیات پیوسته را ممکن می‌کند.","813":"راکتور بستر سیال ذرات جامد را در سیال (گاز یا مایع) رو به بالا معلق نگه می‌دارد و اختلاط و انتقال حرارت عالی ایجاد می‌کند. به دلیل دمای یکنواخت و تماس کارآمد بین فازها، در شکست کاتالیستی، احتراق و واکنش‌های گاز-جامد به‌طور گسترده به کار می‌رود.","814":"کاتالیز جامد شامل کاتالیست جامدی است که واکنش‌ها را تسهیل می‌کند، معمولاً واکنش‌های ناهمگن که در آن‌ها واکنش‌دهنده‌ها در فاز متفاوتی (گاز یا مایع) هستند. نمونه‌ها: شکست کاتالیستی در پالایش نفت و سنتز آمونیاک روی کاتالیست‌های آهن.","815":"واکنش‌های جانبی ناخواسته همراه با واکنش اصلی مطلوب رخ می‌دهند، واکنش‌دهنده‌ها را مصرف می‌کنند و فراورده‌های جانبی می‌سازند که بازده و گزینش‌پذیری را کاهش می‌دهند. مهندسان با کنترل دما، کاتالیست یا طراحی راکتور می‌کوشند این واکنش‌ها را به حداقل برسانند.","816":"تخلخل: کسر فضای خالی در یک ماده نسبت به حجم کل آن.","817":"مربوط به ساختار؛ توانایی ماده (مانند گلولهٔ کاتالیست، تکیه‌گاه بستر پرشده یا دیوارهٔ راکتور) در تحمل نیروهای مکانیکی هنگام کار.","818":"توانایی تحمل نیروهای مکانیکی هنگام عملیات. استحکام ساختاری بالا پایداری بلندمدت و ایمنی تجهیزات شیمیایی را تضمین می‌کند.","819":"مربوط به مقیاس بزرگ؛ راکتورهای صنعتی سامانه‌های بزرگ‌مقیاسی‌اند که برای انجام واکنش‌های شیمیایی طراحی شده‌اند.","820":"سامانه‌هایی با شرایط کنترل‌شدهٔ دما، فشار و جریان برای تولید کارآمد و ایمن محصولات مطلوب.","821":"عبارت «فازهای دخیل» به همهٔ حالت‌های فیزیکی متمایز ماده اشاره دارد که در یک فرایند شرکت می‌کنند.","822":"عبارت «فازهای دخیل» به همهٔ حالت‌های فیزیکی متمایز ماده اشاره دارد که در یک فرایند شرکت می‌کنند.","823":"فشار عملیاتی فشاری است که یک فرایند شیمیایی برای کار ایمن و کارآمد در آن طراحی شده است. این فشار برای طراحی راکتور اهمیت حیاتی دارد.","824":"طراحی راکتور، استحکام ظرف و ملاحظات ایمنی را تحت تأثیر قرار می‌دهد. بالاتر یا پایین‌تر رفتن از این فشار می‌تواند بر سرعت واکنش، بازده و سلامت تجهیزات اثر بگذارد.","825":"خورندگی نشان می‌دهد یک ماده با چه شدتی می‌تواند با مواد تجهیزات واکنش شیمیایی دهد و به لوله‌ها، راکتورها یا مخازن ذخیره آسیب بزند. برای انتخاب مواد، ایمنی و برنامه‌ریزی نگهداری در فرایندهای شیمیایی حیاتی است.","826":"نرخ تولید نشان می‌دهد یک فرایند شیمیایی با چه سرعتی محصول مطلوب را تولید می‌کند. برای طراحی فرایند، بهینه‌سازی و ارزیابی اقتصادی ضروری است.","827":"هم‌زدن: به حرکت درآوردن سیال یا مخلوط با روش مکانیکی برای اختلاط یکنواخت.","828":"کوره‌های کف‌دار کوره‌هایی هستند که در آن‌ها بار (مادهٔ جامد) روی کف قرار می‌گیرد و از زیر یا اطراف گرم می‌شود.","829":"گسترهٔ قابل‌قبول تغییرات در یک اندازه‌گیری یا بُعد.","830":"وسیله‌ای برای بالا بردن عمودی مواد فله‌ای با استفاده از مجموعه‌ای از سطل‌ها.","831":"شرایط یا موادی که باعث خوردگی یا تخریب مواد می‌شوند.","832":"طراحی دقیق شامل مشخصات کامل و برآورد دقیق هزینه.","833":"مکان یا تجهیزی که برای عملکرد یا فعالیتی خاص ساخته شده است.","834":"ارزیابی عملی بودن و موفقیت احتمالی یک پروژه.","835":"مخزن ذخیره‌ای با سقف شناور برای کاهش اتلاف بخار.","836":"نموداری که جریان مواد و فرایندها را در یک سامانه نشان می‌دهد.","837":"دستگاه‌هایی که برای اندازه‌گیری و کنترل خواص فیزیکی یا شیمیایی به کار می‌روند.","838":"اطلاعات حاصل از آزمایش‌ها یا آزمون‌های آزمایشگاهی.","839":"وسایل نقلیه‌ای که برای بالا بردن و جابه‌جایی مواد در فاصله‌های کوتاه به کار می‌روند.","840":"جابه‌جایی، انبار و کنترل مواد در سراسر تولید.","841":"سامانهٔ صنعتی کوچک‌مقیاس برای آزمایش فرایندها پیش از تولید در مقیاس کامل.","842":"آرایش ماشین‌ها، تجهیزات و تأسیسات درون یک کارخانه.","843":"مکان جغرافیایی انتخاب‌شده برای ساخت یا بهره‌برداری از یک کارخانه.","844":"سامانه‌ای که از هوا یا گاز فشرده برای انتقال و کنترل توان استفاده می‌کند.","845":"وسیله‌ای برای کنترل فشار، جریان یا ولتاژ در یک سامانه.","846":"فرایند افزایش مقیاس یک فرایند یا سامانه از مقیاس آزمایشی (پایلوت) به تولید صنعتی کامل.","847":"دمایی که یک ماده در آن نگهداری می‌شود تا کیفیت و ایمنی‌اش حفظ شود.","848":"فرایند جمع‌آوری، تصفیه و دفع مواد ناخواسته یا پسماند.","849":"توسعهٔ فرایندهای شیمیایی یا فیزیکی مورد استفاده در تولید.","850":"حجم یا جرم سیالی که در واحد زمان از یک مقطع عبور می‌کند.","851":"مقدار گرمای لازم برای افزایش دمای واحد جرم یک ماده به اندازهٔ یک درجه.","852":"ظرفی که برای نگهداری گازها یا مایعات در فشاری به‌طور قابل‌توجه متفاوت با فشار محیط طراحی شده است.","853":"وسیله‌ای برای انتقال گرما بین دو یا چند سیال بدون مخلوط کردن آن‌ها.","854":"مخلوطی از مایعات که در حین تقطیر نقطهٔ جوش و ترکیب ثابتی دارد.","855":"واکنش شیمیایی که در آن ماده به‌سرعت با اکسیژن واکنش می‌دهد و گرما و نور تولید می‌کند.","856":"مادهٔ خورنده؛ ماده‌ای که از طریق واکنش شیمیایی باعث فرسودگی یا آسیب به ماده‌ای دیگر می‌شود.","857":"متخصصی که مسئول برآورد، تحلیل و کنترل هزینه‌های پروژه است.","858":"مهندسی که طراحی محصولات، سامانه‌ها یا تجهیزات را ایجاد و توسعه می‌دهد.","859":"مهندسی که روی بهبود و مقیاس‌افزایی محصولات و فرایندها کار می‌کند.","860":"جریان الکتریکی که در یک جهت ثابت جریان دارد.","861":"حضور مواد ناخواسته یا زیان‌آور در یک ماده یا محیط.","862":"به‌آسانی در دمای عادی تبخیر می‌شود؛ ناپایدار یا واکنش‌پذیر.","863":"به‌آسانی مشتعل می‌شود و می‌تواند به‌سرعت بسوزد.","864":"وسیلهٔ ایمنی که از عبور شعله در خطوط گاز یا بخار جلوگیری می‌کند.","865":"وسیله‌ای که با استفاده از مایع یا سازوکار آب‌بندی خشک از نشت گاز جلوگیری می‌کند.","866":"رویه‌های تولید گام‌ها و روش‌هایی هستند که برای تولید یک محصول به کار می‌روند، شامل آماده‌سازی، فرآوری، مونتاژ، بازرسی و بسته‌بندی.","867":"توانایی ماده در هدایت گرما یا الکتریسیته.","868":"فرایند ایجاد ماشین‌ها و سامانه‌های مکانیکی برای مقاصد خاص.","870":"بخشی از کارخانهٔ شیمیایی که در آن عملیات فیزیکی یا شیمیایی مشخصی انجام می‌شود.","871":"ظرفی که واکنش‌های شیمیایی در آن انجام می‌شود.","872":"وسیله‌ای که گرما را از یک ماده به ماده دیگر منتقل می‌کند.","873":"ظرف عمودی که برای جدا کردن مخلوط‌های مایع بر پایهٔ تفاوت فراریت اجزا به کار می‌رود.","874":"تجهیزی که فازهای گاز و مایع را در تماس قرار می‌دهد تا آلاینده‌های فاز گاز در اثر برهم‌کنش در فاز مایع جذب شوند.","875":"وسیله‌ای که باعث تبخیر آب می‌شود.","876":"مادهٔ خامی که در تولید و ساخت یک محصول به کار می‌رود.","877":"مقدار یک مادهٔ شیمیایی موجود در حجم یا جرم معینی از یک مخلوط یا محلول.","878":"حجم یا جرم سیالی که در واحد زمان از یک نقطه می‌گذرد.","879":"رشته‌ای از عملیات شیمیایی یا فیزیکی که مواد خام را به محصولات مطلوب تبدیل می‌کند.","880":"وسیله‌ای که توان را از یک سامانه به سامانهٔ دیگر منتقل می‌کند.","881":"وسیلهٔ مکانیکی که جریان یک ماده (مایع، گاز و ...) را کنترل می‌کند.","882":"تغییر یک کمیت فیزیکی، مانند دما یا غلظت، در واحد فاصله در یک سامانه.","883":"صفحهٔ نازکی با یک سوراخ که برای اندازه‌گیری یا کنترل دبی سیال به کار می‌رود.","884":"لوله‌ای با بخش تنگ‌شده که با ایجاد اختلاف فشار برای اندازه‌گیری جریان سیال به کار می‌رود.","885":"جفت ترموالکتریک برای اندازه‌گیری اختلاف دما.","886":"مقاومتی که به گرما حساس است.","887":"لوله‌ها یا مجراهایی که سیالات، گازها یا سیگنال‌ها را از یک بخش فرایند یا سامانه به بخش دیگر منتقل می‌کنند.","888":"مطالعهٔ چگونگی تغییر متغیرهای فرایند در طول زمان در پاسخ به اغتشاش‌ها یا اقدام‌های کنترلی."};

function nf(n){return LANG==="fa"?Number(n).toLocaleString("fa-IR",{useGrouping:false}):String(n)}
function pct(n){return nf(n)+(LANG==="fa"?"٪":"%")}

function applyLang(){

}
function defOf(w){return LANG==="fa"?(DEFINITIONS_FA[w.id]||w.definition||""):(w.definition||"")}

function defHTML(w,cls="definition"){

const store={

function escapeHTML(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1800)}

function wordOfDay(){
  if(!WORDS.length)return null;

function filteredWords(){
  const q=state.search.trim().toLowerCase();
  return WORDS.filter(w=>{
    const matchesLesson=state.lesson==="all"||String(w.lesson)===String(state.lesson);
    const hay=[w.word,w.meaning,w.definition,DEFINITIONS_FA[w.id]||"",w.topic,LESSON_FA[w.lesson]||""].join(" ").toLowerCase();
    return matchesLesson && (!q||hay.includes(q));
  });
}
function renderDictionary(){

function feedbackHTML(q){
  const w=getWord(q.wordId);
  const ok=state.quiz.lastCorrect;
  const correctText=q.type==="blank"?q.answer:q.options[q.correctIndex];
  const correctIsEn=q.type!=="enfa";
  const yourText=state.quiz.lastAnswer;
  return `<div class="feedback ${ok?"ok":"bad"}">

  </div>`;
}
function quizQuestionHTML(q){
  const answered=state.quiz.answered;
  const selected=state.quiz.selected;

  const lastOk=state.quiz.lastCorrect;
  return `<section class="quiz-layout section" style="margin-top:0">

      <div class="question">${q.type==="faen"?`<span class="question-fa" dir="rtl">${escapeHTML(q.prompt)}</span>`:`<span class="en-q">${escapeHTML(q.prompt)}</span>`}</div>
      ${q.type==="blank"?`<div class="q-hint">${t("blankHint")}</div>
      <div class="actions"><input id="blankAnswer" class="search ltr ${answered?(lastOk?"ok-input":"bad-input"):""}" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("blankPh")}" value="${escapeHTML(answered?(state.quiz.lastAnswer||""):"")}" ${answered?"disabled":""}><button class="btn primary" id="submitBlank" ${answered?"disabled":""}>${t("check")}</button></div>`:
      `<div class="options">${opts.map((o,i)=>`<button class="option ${answered?(i===q.correctIndex?"correct":(i===selected?"wrong":"")):""}" data-option="${i}" ${answered?"disabled":""}>${q.type==="enfa"?`<span dir="rtl">${escapeHTML(o)}</span>`:`<span class="ltr">${escapeHTML(o)}</span>`}</button>`).join("")}</div>`}
      ${answered?feedbackHTML(q):""}
      ${answered?`<div class="actions"><button class="btn primary" id="nextQuestion">${state.quiz.index+1===state.quiz.questions.length?t("seeResult"):t("nextQ")} ${ARW_NEXT()}</button></div>`:""}
    </div>
  </section>`;
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeOptions(correct,field,count=4){
  const pool=shuffle(WORDS.filter(w=>w.id!==correct.id&&w[field]&&w[field]!==correct[field])).slice(0,count-1).map(w=>w[field]);
  return shuffle([correct[field],...pool]);
}
function buildQuestion(w,type){
  if(type==="enfa"){
    const options=makeOptions(w,"meaning");
    return {wordId:w.id,type,prompt:w.word,options,correctIndex:options.indexOf(w.meaning)};
  }
  if(type==="faen"){
    const options=makeOptions(w,"word");
    return {wordId:w.id,type,prompt:w.meaning,options,correctIndex:options.indexOf(w.word)};
  }
  const def=w.definition||`Definition for ${w.word}`;
  let prompt=def;
  const escapedWord=w.word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(new RegExp(escapedWord,"i").test(def)) prompt=def.replace(new RegExp(escapedWord,"i"),"_____");
  return {wordId:w.id,type:"blank",prompt,answer:w.word};
}
function startQuiz(){
  const countVal=$("#quizCount").value;
  const type=$("#quizType").value;
  const random=$("#quizRandom").classList.contains("on");
  let pool=random?shuffle(WORDS):[...WORDS];
  const count=countVal==="all"?pool.length:Math.min(Number(countVal),pool.length);
  pool=pool.slice(0,count);
  const types=["enfa","faen","blank"];
  const questions=pool.map(w=>buildQuestion(w,type==="mixed"?types[Math.floor(Math.random()*types.length)]:type));
  state.quiz={questions,index:0,score:0,answered:false,selected:null,mistakes:[],lastCorrect:false,lastAnswer:""};
  render();
}
function recordQuizStat(correct){
  const qs=store.get("chemeng_quiz_stats",{correct:0,wrong:0});
  qs[correct?"correct":"wrong"]++; store.set("chemeng_quiz_stats",qs);
}
function answerQuiz(index){
  const q=state.quiz.questions[state.quiz.index];
  if(state.quiz.answered)return;
  state.quiz.answered=true;state.quiz.selected=index;
  const correct=index===q.correctIndex;
  state.quiz.lastCorrect=correct;state.quiz.lastAnswer=q.options[index];
  if(correct)state.quiz.score++;
  else state.quiz.mistakes.push({wordId:q.wordId,chosen:q.options[index],correct:q.options[q.correctIndex]});
  recordQuizStat(correct);
  markStudied(q.wordId);save();render();
}
const normAns=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function answerBlank(){
  const q=state.quiz.questions[state.quiz.index]; if(state.quiz.answered)return;
  const input=$("#blankAnswer"); const raw=input.value.trim();
  state.quiz.answered=true;
  const correct=normAns(raw)!==""&&normAns(raw)===normAns(q.answer);
  state.quiz.lastCorrect=correct;state.quiz.lastAnswer=raw;
  if(correct)state.quiz.score++; else state.quiz.mistakes.push({wordId:q.wordId,chosen:raw||"—",correct:q.answer});
  recordQuizStat(correct);
  markStudied(q.wordId);save();render();
}
function goNext(){state.quiz.index++;state.quiz.answered=false;state.quiz.selected=null;state.quiz.lastAnswer="";render()}

}

function openWord(id){
  const w=getWord(id); if(!w)return;
  markStudied(w.id);
  const showEn=defIsFa(w);
  $("#modalContent").innerHTML=`<div class="detail-word ltr">${escapeHTML(w.word)}</div>
    <div class="detail-meaning" dir="rtl">${escapeHTML(w.meaning||"—")}</div>
    <div class="detail-row"><div class="detail-label">${t("pron")}</div><div class="detail-value ltr">${escapeHTML(w.pronunciation||t("notProvided"))}</div></div>
    <div class="detail-row"><div class="detail-label">${t("definition")}</div><div class="detail-value${defIsFa(w)?"":" ltr"}" ${defIsFa(w)?'dir="rtl"':'dir="ltr"'}>${escapeHTML(defOf(w)||t("notProvided"))}</div></div>
    ${showEn?`<div class="detail-row"><div class="detail-label">${t("defEn")}</div><div class="detail-value ltr" dir="ltr">${escapeHTML(w.definition||"")}</div></div>`:""}
    <div class="detail-row"><div class="detail-label">${t("topic")}</div><div class="detail-value">${t("lessonWord")} ${nf(w.lesson)} · ${escapeHTML(lessonTitle(w.lesson))}</div></div>
    ${w.example?`<div class="detail-row"><div class="detail-label">${t("example")}</div><div class="detail-value ltr">${escapeHTML(w.example)}</div>${w.translation?`<div class="detail-value" dir="rtl">${escapeHTML(w.translation)}</div>`:""}</div>`:""}
    <div class="actions"><button class="btn ${isFav(w.id)?"primary":""}" data-modal-fav="${w.id}">${isFav(w.id)?t("remFav"):t("addFav")}</button>
    <button class="btn" data-speak="${w.id}">${t("listen")}</button></div>`;
  $("#modalBackdrop").classList.remove("hidden");
}
function toggleFavorite(id){
  id=Number(id); if(state.favorites.has(id))state.favorites.delete(id);else state.favorites.add(id);save();toast(state.favorites.has(id)?t("addedFav"):t("removedFav"));render();
}
function speak(id){
  const w=getWord(id); if(!w||!("speechSynthesis" in window))return toast(t("noSpeech"));
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.word);u.lang="en-US";speechSynthesis.speak(u);
}
document.addEventListener("click",e=>{
  if(e.target.id==="langToggle"||e.target.closest("#langToggle")){LANG=LANG==="fa"?"en":"fa";render();if(!$("#modalBackdrop").classList.contains("hidden")&&window.__openWord)openWord(window.__openWord);return}
  const page=e.target.closest("[data-page]"); if(page){setPage(page.dataset.page);return}
  const word=e.target.closest("[data-word]"); if(word){window.__openWord=word.dataset.word;openWord(word.dataset.word);return}
  const fav=e.target.closest("[data-fav]"); if(fav){e.stopPropagation();toggleFavorite(fav.dataset.fav);return}
  const lesson=e.target.closest("[data-lesson]"); if(lesson){state.lesson=lesson.dataset.lesson;state.dictPage=1;render();return}
  const pg=e.target.closest("[data-dict-page]"); if(pg){state.dictPage=Math.max(1,Number(pg.dataset.dictPage));render();return}
  if(e.target.closest("[data-flip]")||e.target.closest("#flashcard")){state.flashFlipped=!state.flashFlipped;renderFlashcards();return}
  const flash=e.target.closest("[data-flash]"); if(flash){state.flashIndex=(state.flashIndex+Number(flash.dataset.flash)+WORDS.length)%WORDS.length;state.flashFlipped=false;renderFlashcards();return}
  const opt=e.target.closest("[data-option]"); if(opt){answerQuiz(Number(opt.dataset.option));return}
  const sw=e.target.closest("#quizRandom"); if(sw){sw.classList.toggle("on");return}
  if(e.target.id==="startQuiz"){startQuiz();return}
  if(e.target.id==="submitBlank"){answerBlank();return}
  if(e.target.id==="nextQuestion"){goNext();return}
  if(e.target.id==="reviewMistakes"){state.quiz.review=true;renderQuizResult();return}
  if(e.target.id==="newQuiz"){state.quiz=null;render();return}
  const mf=e.target.closest("[data-modal-fav]"); if(mf){toggleFavorite(mf.dataset.modalFav);openWord(mf.dataset.modalFav);return}
  const sp=e.target.closest("[data-speak]"); if(sp){speak(sp.dataset.speak);return}
  if(e.target.id==="resetProgress"){state.studied.clear();store.set("chemeng_studied",[]);toast(t("resetDone"));render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="dictSearch"){state.search=e.target.value;state.dictPage=1;renderDictionary();const el=$("#dictSearch");if(el){el.focus();el.setSelectionRange(state.search.length,state.search.length)}}
});
document.addEventListener("change",e=>{if(e.target.id==="perPage"){state.perPage=Number(e.target.value);state.dictPage=1;renderDictionary()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")$("#modalBackdrop").classList.add("hidden");
  if(e.key==="Enter"&&state.page==="quiz"&&state.quiz){
    if(e.target.id==="blankAnswer"&&!state.quiz.answered){e.preventDefault();answerBlank()}
    else if(state.quiz.answered&&state.quiz.questions[state.quiz.index]&&e.target.tagName!=="BUTTON"){e.preventDefault();goNext()}
  }
});
$("#themeToggle").addEventListener("click",()=>{state.theme=state.theme==="dark"?"light":"dark";applyTheme();render()});
$("#menuToggle").addEventListener("click",()=>$("#mobileNav").classList.toggle("open"));
$("#modalClose").addEventListener("click",()=>$("#modalBackdrop").classList.add("hidden"));
$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")$("#modalBackdrop").classList.add("hidden")});

function boot(){
  WORDS=EMBEDDED_WORDS; LESSONS=EMBEDDED_LESSONS;
  state.favorites=new Set(store.get("chemeng_favorites",[]));
  state.studied=new Set(store.get("chemeng_studied",[]));
  render();
}
boot();
</script>
</body>
</html>
